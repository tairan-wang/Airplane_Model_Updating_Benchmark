# Dataset generation config for generative-model training
# Units: a,b in mm; E1,E2 sampled as multiples of 1e11 Pa (convert to MPa for Abaqus)

abaqus_cmd: abaqus
# User-updated FEM (source of truth)
master_cae: D:\python_run_package\abaqus_model\fem_model.cae
local_cae_name: master_model.cae

# Output layout
samples_dir: samples
runs_dir: samples/runs
dataset_dir: dataset
script_inp: abaqus_run_single.py
script_extract: extract_odb.py

# LHS sampling (uniform priors, Table 6 primary ranges)
n_samples: 200
seed: 42
bounds:
  a:  [266.0, 286.0]   # mm (updated FEM)
  b:  [20.0,  30.0]    # mm
  E1: [0.5,   0.9]     # x 1e11 Pa
  E2: [0.5,   0.9]     # x 1e11 Pa

# Parallel / resource
max_workers: 2          # 2 concurrent solves x 4 cpus = 8 threads (= physical
                        # cores). 16 threads oversubscribed all cores and made
                        # each solve crawl past the timeout.
cpus_per_job: 4
memory_per_job: "24 gb" # per-solve cap. Model is ~1M DOF and needs >4 GB;
                        # 2 concurrent x 24 = 48 GB, leaves headroom on 64 GB.
gen_inp_workers: 1      # MUST stay 1: parallel CAE + cleanup kills sibling jobs
timeout_gen_s: 1800
timeout_solve_s: 5400   # 90 min; single solve is ~30 min, give slow ones margin
timeout_extract_s: 600

# Modes kept after discarding rigid-body / near-zero frequencies
n_modes_keep: 7
